name: Check installers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y busybox jq
      - name: Build standalone installers
        shell: pwsh
        run: ./tools/build.ps1
      - name: Verify reproducible build
        run: git diff --exit-code -- install.sh install-xkeen-addons.sh install-mihomo-tun.sh
      - name: Check BusyBox ash syntax
        run: |
          for file in install.sh install-xkeen-addons.sh install-mihomo-tun.sh scripts/* tools/*.template.sh; do
            busybox ash -n "$file"
          done
      - name: Offline subscription and setup tests
        run: python3 tests/test_setup.py
      - name: Download pinned Mihomo for integration checks
        run: |
          curl --proto '=https' --proto-redir '=https' -fLsS --retry 3 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz -o /tmp/mihomo.gz
          echo 'ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20  /tmp/mihomo.gz' | sha256sum -c -
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo-test
          chmod +x /tmp/mihomo-test
      - name: TUN scripts and native Mihomo provider/API tests
        env:
          MIHOMO_BIN: /tmp/mihomo-test
        run: python3 tests/test_mtun.py
