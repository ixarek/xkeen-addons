name: Check installers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y busybox jq
      - name: Build standalone installers
        shell: pwsh
        run: ./tools/build.ps1
      - name: Verify reproducible build
        run: git diff --exit-code -- install.sh install-xkeen-addons.sh
      - name: Check BusyBox ash syntax
        run: |
          for file in install.sh install-xkeen-addons.sh scripts/* tools/*.template.sh; do
            busybox ash -n "$file"
          done
      - name: Offline subscription and setup tests
        run: python3 tests/test_setup.py
